<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ff758c">
    <title>A Very Important Question ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100svh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
        }

        .box {
            background: rgba(255, 255, 255, 0.97);
            padding: 32px 24px;
            border-radius: 28px;
            text-align: center;
            width: min(100%, 390px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.22);
        }

        h1 {
            margin: 0 0 18px;
            color: #ff4f81;
            font-size: clamp(28px, 8vw, 38px);
        }

        p {
            margin: 12px 0;
            font-size: clamp(17px, 4.5vw, 20px);
            line-height: 1.5;
            color: #555;
        }

        .question {
            font-size: clamp(20px, 5.5vw, 25px);
            color: #ff4f81;
        }

        .buttons {
            margin-top: 30px;
            min-height: 52px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        button {
            border: none;
            padding: 13px 25px;
            border-radius: 999px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        #yes {
            background: #ff4f81;
            color: white;
            box-shadow: 0 5px 15px rgba(255, 79, 129, 0.35);
        }

        #yes:active {
            transform: scale(0.95);
        }

        #no {
            background: #e5e5e5;
            color: #555;
            position: fixed;
            z-index: 10;
            transition: left 0.18s ease, top 0.18s ease;
        }

        #message {
            display: none;
            margin-top: 25px;
            font-size: clamp(21px, 6vw, 27px);
            line-height: 1.35;
            color: #ff4f81;
            font-weight: bold;
        }

        .heart {
            position: fixed;
            z-index: 20;
            pointer-events: none;
            font-size: clamp(22px, 7vw, 32px);
            animation: float 3s linear forwards;
        }

        @keyframes float {
            from {
                transform: translateY(0) scale(0.8);
                opacity: 1;
            }
            to {
                transform: translateY(-90svh) scale(1.2);
                opacity: 0;
            }
        }

        @media (max-width: 380px) {
            body {
                padding: 14px;
            }

            .box {
                padding: 28px 18px;
            }

            button {
                padding: 12px 22px;
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Hey Beautiful ❤️</h1>

        <p>I have a very important question...</p>

        <p class="question">
            Can I call you <b>Baby?</b> 🥺❤️
        </p>

        <div class="buttons">
            <button id="yes" onclick="sayYes()">YES ❤️</button>
            <button id="no" type="button">NO 😭</button>
        </div>

        <div id="message">
            YAYYY! ❤️🥰<br><br>
            You're officially my Baby now! 💕
        </div>
    </div>

    <script>
        const noButton = document.getElementById("no");

        function moveNoButton() {
            const margin = 15;

            const maxX = Math.max(
                margin,
                window.innerWidth - noButton.offsetWidth - margin
            );

            const maxY = Math.max(
                margin,
                window.innerHeight - noButton.offsetHeight - margin
            );

            const randomX =
                margin + Math.random() * (maxX - margin);

            const randomY =
                margin + Math.random() * (maxY - margin);

            noButton.style.left = randomX + "px";
            noButton.style.top = randomY + "px";
        }

        // Desktop: run away when the mouse gets close.
        noButton.addEventListener("mouseenter", moveNoButton);

        // Phone: run away when she touches it.
        noButton.addEventListener("touchstart", function(event) {
            event.preventDefault();
            moveNoButton();
        }, { passive: false });

        // Extra support for mobile browsers.
        noButton.addEventListener("pointerdown", function(event) {
            if (event.pointerType === "touch") {
                event.preventDefault();
                moveNoButton();
            }
        });

        function sayYes() {
            document.getElementById("message").style.display = "block";
            document.querySelector(".buttons").style.display = "none";

            for (let i = 0; i < 35; i++) {
                const heart = document.createElement("div");

                heart.className = "heart";
                heart.innerHTML = Math.random() > 0.2 ? "❤️" : "💕";

                heart.style.left = Math.random() * 100 + "vw";
                heart.style.top = (75 + Math.random() * 25) + "svh";
                heart.style.animationDelay = Math.random() * 0.8 + "s";

                document.body.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 4000);
            }
        }
    </script>

</body>
</html>
